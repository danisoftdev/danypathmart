# Auto-deploy DanyPathMart to Hostinger when code is pushed to main.
# Setup: see DEPLOY-AUTO.md

name: Deploy to Hostinger (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy frontend (dist)
        env:
          SSH_OPTS: -p ${{ secrets.HOSTINGER_SSH_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            frontend/dist/ "$REMOTE:$WEB_ROOT/"

      - name: Deploy SPA .htaccess
        env:
          SSH_OPTS: -p ${{ secrets.HOSTINGER_SSH_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          scp $SSH_OPTS deploy/public_html.htaccess "$REMOTE:$WEB_ROOT/.htaccess"

      - name: Deploy database migrations
        env:
          SSH_OPTS: -p ${{ secrets.HOSTINGER_SSH_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          rsync -avz -e "ssh $SSH_OPTS" \
            database/ "$REMOTE:$WEB_ROOT/database/"

      - name: Deploy backend (API)
        env:
          SSH_OPTS: -p ${{ secrets.HOSTINGER_SSH_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          rsync -avz -e "ssh $SSH_OPTS" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'storage/mail/' \
            backend/ "$REMOTE:$WEB_ROOT/api/"

      - name: Post-deploy (migrations + env check)
        env:
          SSH_OPTS: -p ${{ secrets.HOSTINGER_SSH_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new
          REMOTE: ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          ssh $SSH_OPTS "$REMOTE" "bash -s" -- "$WEB_ROOT" < deploy/remote-post-deploy.sh

      - name: Deployment summary
        run: |
          echo "Deployed to Hostinger from commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
