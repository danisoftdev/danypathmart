# Auto-deploy DanyPathMart to Hostinger when code is pushed to main.
# Setup: see DEPLOY-AUTO.md

name: Deploy to Hostinger (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          set -euo pipefail
          missing=0
          for var in SSH_KEY SSH_HOST SSH_USER WEB_ROOT; do
            if [ -z "${!var}" ]; then
              echo "::error::GitHub secret HOSTINGER_${var#SSH_} is not set (see DEPLOY-AUTO.md)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ -z "${SSH_PORT}" ]; then
            echo "::warning::HOSTINGER_SSH_PORT is empty — using Hostinger default 65002."
            SSH_PORT=65002
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          {
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_USER=$SSH_USER"
            echo "WEB_ROOT=$WEB_ROOT"
            echo "REMOTE=${SSH_USER}@${SSH_HOST}"
            echo "RSYNC_SSH=ssh -p ${SSH_PORT} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new"
            echo "SSH_CMD=ssh -p ${SSH_PORT} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new"
            echo "SCP_CMD=scp -P ${SSH_PORT} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=accept-new"
          } >> "$GITHUB_ENV"

      - name: Deploy frontend (dist)
        run: |
          rsync -avz --delete -e "$RSYNC_SSH" \
            frontend/dist/ "$REMOTE:$WEB_ROOT/"

      - name: Deploy SPA .htaccess
        run: |
          $SCP_CMD deploy/public_html.htaccess "$REMOTE:$WEB_ROOT/.htaccess"

      - name: Deploy database migrations
        run: |
          rsync -avz -e "$RSYNC_SSH" \
            database/ "$REMOTE:$WEB_ROOT/database/"

      - name: Deploy backend (API)
        run: |
          rsync -avz -e "$RSYNC_SSH" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'storage/mail/' \
            backend/ "$REMOTE:$WEB_ROOT/api/"

      - name: Post-deploy (migrations + env check)
        run: |
          $SSH_CMD "$REMOTE" "bash -s" -- "$WEB_ROOT" < deploy/remote-post-deploy.sh

      - name: Deployment summary
        run: |
          echo "Deployed to Hostinger from commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Remote: $REMOTE"
          echo "Web root: $WEB_ROOT"
