# Auto-deploy DanyPathMart to Hostinger when code is pushed to main.
# Setup: see DEPLOY-AUTO.md

name: Deploy to Hostinger (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          export VITE_API_BASE_URL='${{ secrets.VITE_API_BASE_URL }}'
          export VITE_APP_NAME='${{ secrets.VITE_APP_NAME }}'
          export VITE_PAYSTACK_PUBLIC_KEY='${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}'
          export VITE_WEBAUTHN_RP_ID='${{ secrets.VITE_WEBAUTHN_RP_ID }}'
          missing=0
          for var in VITE_API_BASE_URL VITE_APP_NAME VITE_PAYSTACK_PUBLIC_KEY VITE_WEBAUTHN_RP_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::GitHub secret $var is not set (see DEPLOY-AUTO.md)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ----------------------------------------------------------------------
      # TEMPORARY DEBUG STEP — remove once HOSTINGER_SSH_HOST issue is solved.
      # Prints byte-level dump of the secret so hidden \n / \r / spaces show up.
      # od -An -c output does not match the raw secret string, so GitHub's log
      # masking will not redact it.
      # ----------------------------------------------------------------------
      - name: Debug secret bytes (temporary)
        env:
          SECRET_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SECRET_WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          echo "--- HOSTINGER_SSH_HOST ---"
          echo "Length: ${#SECRET_SSH_HOST}"
          printf '%s' "$SECRET_SSH_HOST" | od -An -c | head -5
          echo "--- HOSTINGER_WEB_ROOT ---"
          echo "Length: ${#SECRET_WEB_ROOT}"
          printf '%s' "$SECRET_WEB_ROOT" | od -An -c | head -5

      - name: Validate Hostinger secrets
        env:
          SECRET_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SECRET_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SECRET_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SECRET_WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          set -euo pipefail

          # Strip CR, leading/trailing whitespace, AND any trailing newline
          # that may have been captured into the variable itself.
          trim() {
            printf '%s' "$1" | tr -d '\r' | tr -d '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          require_single_line() {
            local name="$1"
            local raw="$2"
            if [ -z "$raw" ]; then
              echo "::error::GitHub secret $name is not set (see DEPLOY-AUTO.md)."
              exit 1
            fi
            # Count lines robustly instead of grepping for a literal \n
            local line_count
            line_count=$(printf '%s' "$raw" | wc -l)
            local has_trailing_content
            has_trailing_content=$(printf '%s' "$raw" | tail -c 1)
            if [ "$line_count" -gt 0 ] && [ -n "$has_trailing_content" ]; then
              line_count=$((line_count + 1))
            fi
            if [ "$line_count" -gt 1 ]; then
              echo "::error::GitHub secret $name has multiple lines ($line_count lines detected)."
              if printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
                echo "::error::You pasted the PRIVATE KEY into $name. Delete this secret and recreate it."
                echo "::error::Private key goes ONLY in HOSTINGER_SSH_KEY."
              fi
              if [ "$name" = "HOSTINGER_SSH_HOST" ]; then
                echo "::error::HOSTINGER_SSH_HOST must be exactly: 82.25.113.25"
              fi
              if [ "$name" = "HOSTINGER_WEB_ROOT" ]; then
                echo "::error::HOSTINGER_WEB_ROOT must be exactly: /home/u161582953/domains/danypathmart.store/public_html"
              fi
              exit 1
            fi
          }

          require_single_line HOSTINGER_SSH_HOST "$SECRET_SSH_HOST"
          require_single_line HOSTINGER_SSH_USER "$SECRET_SSH_USER"
          require_single_line HOSTINGER_WEB_ROOT "$SECRET_WEB_ROOT"

          SSH_HOST="$(trim "$SECRET_SSH_HOST")"
          SSH_USER="$(trim "$SECRET_SSH_USER")"
          WEB_ROOT="$(trim "$SECRET_WEB_ROOT")"
          SSH_PORT="$(trim "$SECRET_SSH_PORT")"

          if [ -z "$SSH_PORT" ]; then
            echo "::warning::HOSTINGER_SSH_PORT is empty — using Hostinger default 65002."
            SSH_PORT=65002
          fi

          if ! printf '%s' "$SSH_HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "::error::HOSTINGER_SSH_HOST must be the server IP only (e.g. 82.25.113.25). Current value does not look like an IP."
            echo "::error::Current trimmed value: '$SSH_HOST'"
            exit 1
          fi

          if ! printf '%s' "$WEB_ROOT" | grep -q '^/home/'; then
            echo "::error::HOSTINGER_WEB_ROOT must be an absolute path starting with /home/ (no trailing slash)."
            echo "::error::Current trimmed value: '$WEB_ROOT'"
            exit 1
          fi

          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
            echo "WEB_ROOT=$WEB_ROOT"
            echo "REMOTE=${SSH_USER}@${SSH_HOST}"
          } >> "$GITHUB_ENV"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Verify SSH agent
        run: |
          if ! ssh-add -l; then
            echo "::error::SSH agent has no key. Re-save HOSTINGER_SSH_KEY with the full private key from:"
            echo "::error::  type C:\\Users\\user\\.ssh\\hostinger_deploy"
            echo "::error::Include -----BEGIN OPENSSH PRIVATE KEY----- and -----END OPENSSH PRIVATE KEY-----"
            exit 1
          fi

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::warning::ssh-keyscan failed — continuing (StrictHostKeyChecking=accept-new on first connect)"
          fi

      - name: Test SSH connection
        run: |
          set -e
          echo "Connecting to $REMOTE on port $SSH_PORT ..."
          if ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "$REMOTE" "echo SSH_OK && test -d '$WEB_ROOT' && echo WEB_ROOT_OK"; then
            echo "SSH and WEB_ROOT verified."
          else
            code=$?
            echo "::error::SSH failed (exit $code). Usually exit 255 = authentication failed."
            echo "::error::1) Add the PUBLIC key to Hostinger hPanel → SSH Access → SSH keys"
            echo "::error::   (type C:\\Users\\user\\.ssh\\hostinger_deploy.pub on your PC)"
            echo "::error::2) HOSTINGER_SSH_KEY = private key only (hostinger_deploy, not .pub)"
            echo "::error::3) HOSTINGER_SSH_PORT = 65002"
            echo "::error::4) Test on PC: ssh -p 65002 -i C:\\Users\\user\\.ssh\\hostinger_deploy u161582953@82.25.113.25 echo OK"
            exit "$code"
          fi

      - name: Deploy frontend (dist)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ "${REMOTE}:${WEB_ROOT}/"

      - name: Deploy SPA .htaccess
        run: |
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            deploy/public_html.htaccess "${REMOTE}:${WEB_ROOT}/.htaccess"

      - name: Deploy database migrations
        run: |
          rsync -avz \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            database/ "${REMOTE}:${WEB_ROOT}/database/"

      - name: Deploy backend (API)
        run: |
          rsync -avz \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'storage/mail/' \
            backend/ "${REMOTE}:${WEB_ROOT}/api/"

      - name: Post-deploy (migrations + env check)
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$REMOTE" "bash -s" -- "$WEB_ROOT" < deploy/remote-post-deploy.sh

      - name: Deployment summary
        run: |
          echo "Deployed to Hostinger from commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Remote: $REMOTE"
          echo "Web root: $WEB_ROOT"
          echo "SSH port: $SSH_PORT"